spring.application.name=controle-financeiro

# Banco em memoria (H2) - nao precisa instalar nada
spring.datasource.url=jdbc:h2:mem:financeiro
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Alerta de gasto: despesas acima deste valor geram um aviso no log
financeiro.limite-alerta-despesa=500.00
